# fly.toml — Customer Report API for Global66
# Deploy with: fly deploy (from the api/ directory)

app = "global66-customer-report"
primary_region = "scl"  # Santiago, Chile — closest to DB

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

  # NET_ADMIN + tun device required for OpenVPN
  [[vm.mounts]]

[experimental]
  # Required for OpenVPN TUN device
  enable_consul = false
