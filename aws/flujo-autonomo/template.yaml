AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Flujo automático DESATENDIDO de la Bandeja de Casos: las colas OFAC y REMESA.
  Consulta en listas, cruza con el catálogo, decide, y cierra en Salesforce y en
  Admin, sin navegador. Stack INDEPENDIENTE del receptor de casos, del logger y
  del sync diario.

  El switch `config/flujoAutomatico` de Firestore manda, y cada cola tiene el
  suyo: `ofac.enabled` y `remesa.enabled`. Prender una no prende la otra. Si el de
  la cola no es exactamente true, esa cola no se toca.

Parameters:
  FirebaseSaB64:
    Type: String
    NoEcho: true
    Description: Service account de Firebase (JSON) en base64.
  ProxyUrl:
    Type: String
    Description: >
      URL del Worker empresadocs-proxy. Es por donde salen los cierres a
      Salesforce y a Admin; sin esto la función no puede cerrar nada.
  RegcheqApiKey:
    Type: String
    NoEcho: true
    Description: API key de Regcheq (screening de Chile).
  TriggerSecret:
    Type: String
    NoEcho: true
    Description: >
      Secreto que exige la Function URL para disparar una corrida a mano. La URL
      es pública por definición, así que la autorización va en el pedido. Sin
      este secreto, la puerta HTTP rechaza todo y solo funciona el cron.
  FirestoreCollection:
    Type: String
    Default: casos_sf
  Habilitada:
    Type: String
    Default: 'DISABLED'
    AllowedValues: ['ENABLED', 'DISABLED']
    Description: >
      Estado del cron. Arranca DISABLED a propósito: el stack se despliega y
      recién se habilita cuando se decide. Es el segundo interruptor, además del
      de Firestore.
  Lote:
    Type: String
    Default: '8'
    Description: >
      Consultas al proveedor en paralelo. Era 4, heredado de la app.

      El screening ES el cuello: una consulta a Inspektor tarda ~12,8 s, y con 91
      casos sin screening eso da 291 s con lote 4 — que explica los 285 s medidos
      de la corrida completa. Con 8 baja a ~146 s.

      No se subió más de golpe a propósito: duplicar es un paso medible, y si el
      proveedor empieza a limitar hay que verlo antes de multiplicar por cuatro.
      La duración queda registrada en cada corrida para poder decidirlo con datos.
  PresupuestoMs:
    Type: String
    Default: '780000'
    Description: >
      13 de los 15 minutos. Se corta por RELOJ y no por cantidad: Regcheq tiene
      p90 de ~47 s por consulta, así que "N casos" no acota la corrida. Lo que
      queda se toma en la próxima; el screening queda cacheado y no se re-paga.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 900          # 15 min, el techo de Lambda
    MemorySize: 1024
    Architectures: [arm64]

Resources:
  FlujoAutonomoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lens-flujo-autonomo
      Handler: index.handler
      CodeUri: dist/
      Description: >
        Corre el flujo automático de OFAC sin navegador. Importa el screening, la
        decisión y los cierres del mismo código que usa la app (ver build.sh).
      Environment:
        Variables:
          FIREBASE_SA_JSON: !Ref FirebaseSaB64
          EMPRESADOCS_PROXY_URL: !Ref ProxyUrl
          # El nombre lleva el prefijo VITE_ porque el código compartido lo lee
          # así (en el navegador lo sustituye Vite). El build redefine
          # `import.meta.env` a `process.env`, así que acá llega por este nombre.
          VITE_REGCHEQ_API_KEY: !Ref RegcheqApiKey
          FIRESTORE_COLLECTION: !Ref FirestoreCollection
          LOTE: !Ref Lote
          PRESUPUESTO_MS: !Ref PresupuestoMs
          SCREENING_SCHEMA: '3'
          TRIGGER_SECRET: !Ref TriggerSecret
          REGLA_CRON: lens-flujo-autonomo
      # Permisos mínimos: ver y cambiar SU PROPIA regla de cron. Es lo que permite
      # que el interruptor esté en el mantenedor y no en una terminal.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - events:DescribeRule
                - events:EnableRule
                - events:DisableRule
              Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/lens-flujo-autonomo'

      # Puerta para el botón «Correr ahora» de la cola. AuthType NONE porque el
      # navegador no puede firmar IAM; la autorización la hace el handler con el
      # header `x-lens-trigger`, y el secreto lo guarda el Worker — nunca llega al
      # navegador.
      #
      # El riesgo está acotado por diseño: disparar una corrida no puede cerrar
      # nada que el cron no cerraría igual. Los dos switches y todos los frenos se
      # evalúan lo mismo.
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Events:
        Periodico:
          Type: Schedule
          Properties:
            # FIJO, no parametrizado. Un valor con espacios pasado por
            # --parameter-overrides llega partido y EventBridge lo rechaza con
            # "ScheduleExpression is not valid" (probado: rollback dos veces).
            # Y además conviene que un cambio de horario se vea en un diff.
            #
            # CADA MINUTO, 24/7. Pedido explícito: un cliente de la whitelist
            # tiene que liberarse en un minuto como máximo.
            #
            # Esto ya estuvo en 5 minutos y NO daba: con Colombia prendida las
            # corridas tardan 285 s de mediana (máx 316) y se pisaban. Se subió a
            # 15 por eso y por la cuota de lectura de Firestore.
            #
            # A un minuto funciona por dos cosas que antes no estaban:
            #
            #   · EL CANDADO. Las invocaciones que caen sobre una corrida en vuelo
            #     rebotan y cuestan UNA lectura. Que una corrida dure 316 s ya no
            #     importa: no se pisan, se saltean.
            #   · EL SONDEO (`SONDEO_COMPLETO_MS` en index.ts). Antes de leer la
            #     cola, la corrida pregunta por 2 lecturas si llegó algo o si
            #     cambió la whitelist. Si no, termina ahí. Sin eso, 1.440 corridas
            #     por día leyendo la cola entera serían ~165.000 lecturas contra
            #     una cuota de 50.000 que comparte TODO Lens.
            #
            # Con el sondeo el consumo queda en ~11.000/día, igual que con 15 min.
            #
            # Los casos llegan a cualquier hora —el receptor es un Lambda y
            # Salesforce le escribe directo— así que es 24/7.
            #
            # OFAC no depende de Redshift y funciona a toda hora. La cola de
            # REMESAS sí lo necesita para traer la fila de la transacción, y el
            # cluster pausa 18:30–04:00 hora Chile: en esa ventana el paso de
            # remesas se OMITE con un aviso, no marca cada caso como error. Se
            # retoman solos cuando el cluster vuelve.
            Schedule: 'cron(* * * * ? *)'
            Name: lens-flujo-autonomo
            Description: Procesa las colas de OFAC y remesas sin intervención.
            # `State` y no `Enabled`. Con `Enabled: false` el parámetro decía
            # DISABLED, el output del stack decía DISABLED, y la regla de
            # EventBridge se quedaba en ENABLED: el apagado no llegaba y el cron
            # seguía corriendo. Verificado con `aws events describe-rule`, que es
            # la única fuente que vale — el output del stack repetía el parámetro,
            # no el estado real.
            State: !Ref Habilitada


Outputs:
  FunctionName:
    Value: !Ref FlujoAutonomoFunction
  LogGroup:
    Value: !Sub '/aws/lambda/${FlujoAutonomoFunction}'
  Horario:
    Value: 'cron(* * * * ? *) — cada minuto, 24/7 (con sondeo barato)'
  UrlDisparador:
    Description: Pegar en el secret FLUJO_TRIGGER_URL del Worker.
    Value: !GetAtt FlujoAutonomoFunctionUrl.FunctionUrl
  EstadoCron:
    Value: !Ref Habilitada
  Aviso:
    Value: >
      Tres interruptores: este cron, `config/flujoAutomatico.ofac.enabled` y
      `config/flujoAutomatico.remesa.enabled`. Los de Firestore frenan también la
      corrida en curso, porque se releen entre lotes.
