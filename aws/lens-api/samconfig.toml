version = 0.1

[default.deploy.parameters]
# Los nombres `lens-api` y `lens-api-fnurl` NO se pueden reutilizar: quedaron en
# ROLLBACK_FAILED y ROLLBACK_COMPLETE de dos intentos fallidos, y
# `compliance-admin` no tiene `cloudformation:DeleteStack` para limpiarlos.
# Hay que pedirle a alguien con más permisos que los borre.
stack_name = "lens-analisis-fnurl"
resolve_s3 = true
s3_prefix = "lens-api"
region = "us-east-1"
# IAM y no NAMED_IAM: el rol lo maneja SAM. Se intentó nombrarlo a mano para
# conocer su ARN de antemano, pero `compliance-admin` no tiene `iam:CreateRole`
# —el despliegue falla y revierte— y además no hacía falta: el stack ya está
# desplegado desde el 31-08-2026 y el ARN del rol se lee del stack.
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
# Perfil AWS SSO de compliance (cuenta 561521480266). Único con CloudFormation.
profile = "compliance-admin"
# Los parámetros que NO son secretos, con sus valores vivos. Son el registro de
# cómo está desplegado el servicio, y la segunda red debajo de los defaults del
# template. OJO: si un deploy pasa `--parameter-overrides` por línea de comandos,
# esa lista REEMPLAZA a esta entera —no se mezclan—; por eso los defaults del
# template también son los valores vivos.
parameter_overrides = "CrearTablaCorridas=true CrearTablaIdempotencia=true DisparoAsincrono=true AmbientesCorridas=dev,ci,prod TiposPrincipales=company_deeds_document MaxDocumentosLote=2 MaxDocumentos=12 MaxPaginasOcr=15 MotorOcr=textract BucketDocumentos=g66-company"
# Los secretos (`ApiSecretValue`, `GeminiApiKey`) NO van acá: el repo es
# público. SAM conserva el valor anterior si no se pasan.
