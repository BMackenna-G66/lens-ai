AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  lens-api — el procesamiento documental de Lens expuesto por HTTP.
  Entra un documento, sale la ficha de 18 campos. La ingesta corre por cuenta
  de quien llama. No toca la SPA.

Parameters:
  ApiSecretValue:
    Type: String
    NoEcho: true
    Description: Secreto del header x-api-secret que valida el handler.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: API Key de Gemini.
  MotorOcr:
    Type: String
    Default: textract
    AllowedValues: [textract, ninguno]
    Description: >
      `textract` habilita el OCR para las páginas sin capa de texto.
      `ninguno` lo desactiva: los escaneos vuelven con aviso en lugar de texto.
      Sirve para desplegar antes de tener Textract habilitado en la cuenta.
  MaxPaginasOcr:
    Type: Number
    Default: 15
    Description: Tope de páginas por documento que se mandan al OCR. Las páginas con capa de texto no cuentan.
  MaxDocumentos:
    Type: Number
    Default: 12
    Description: Tope de documentos por petición.
  DominiosUrlPermitidos:
    Type: String
    Default: ''
    Description: >
      Dominios separados por coma desde los que se acepta bajar un documento por URL.
      Vacío desactiva la descarga por URL (default). Sin lista, el servicio sería un SSRF.
  CrearTablaIdempotencia:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Si se crea la tabla DynamoDB que da idempotencia a POST /v1/analyses.
      Arranca en `false` porque `compliance-admin` NO tiene `dynamodb:CreateTable`
      —probado: el despliegue falla y revierte el stack entero—, y sin esto no se
      podría desplegar NADA del resto. En `false` el almacén corre en memoria: la
      idempotencia no sobrevive entre invocaciones y `/salud` lo dice en
      `almacen_idempotencia`. Poner en `true` apenas exista el permiso.
  CrearTablaCorridas:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Si se crea la tabla DynamoDB de la persistencia operacional por empresa
      (Fase 1 del plan LENS ⇄ Onboarding B2B): la que responde «¿cuál fue la
      última corrida de esta empresa?», que es lo que preguntan EP-2 y EP-3.
      Arranca en `false` por el MISMO motivo que `CrearTablaIdempotencia`:
      `compliance-admin` no tiene `dynamodb:CreateTable`, y sin esto no se podría
      desplegar nada del resto. En `false` corre en memoria y `/salud` lo dice en
      `corridas_persistentes`. Es otra tabla, no la misma: una indexa por
      `analysisId` y la otra por ambiente + `companyId`.
  AmbientesCorridas:
    Type: String
    Default: dev,ci,prod
    Description: >
      Ambientes admitidos, separados por coma. Los tres están confirmados con
      Onboarding: `dev`, `ci` y `prod`. Con la lista puesta, un `production` en
      vez de `prod` devuelve 400 en vez de guardar la corrida en un ambiente
      fantasma — que es lo que pasaba con la lista vacía: EP-2 respondía
      NOT_STARTED sobre algo que sí se analizó. VACÍO acepta cualquiera y solo
      sirve para una prueba local.
  DisparoAsincrono:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Si EP-1 responde el 202 ANTES de procesar, invocándose a sí misma en
      segundo plano. Arranca en `false` porque eso necesita
      `lambda:InvokeFunction` sobre la propia función — un permiso, y lo medido
      el 12-09-2026 es que cualquier despliegue que toque permisos con
      `compliance-admin` falla Y deja el stack trabado. En `false` el trabajo
      corre en línea: el 202 sale igual y con el mismo contenido, pero después
      de procesar. `/salud` lo dice en `disparo_asincrono`.
  TiposPrincipales:
    Type: String
    Default: company_deeds_document
    Description: >
      Los `documentType` que cuentan como documento PRINCIPAL, separados por
      coma. §5.2 fija tres y el principal es la escritura
      (`company_deeds_document`); `company_shareholders_document` y
      `company_id_document` son complementarios. Importa: §8 dice que FAILED
      consume uno de los 3 intentos de lectura del usuario e INCOMPLETE no, así
      que marcar todo como principal le quema un intento cada vez que falla un
      complementario. VACÍO sigue significando TODOS principales, que es lo
      correcto si alguna vez llega un lote sin `documentType` declarado.
  MaxDocumentosLote:
    Type: Number
    Default: 2
    Description: >
      Tope de documentos por petición de EP-1. La especificación v1.2 lo bajó a
      2. Es el tope de ESE contrato: `MaxDocumentos` (12) sigue siendo el de
      `/v1/analisis` y no se toca.
  BucketDocumentos:
    Type: String
    Default: g66-company
    Description: >
      Bucket del que `POST /v1/analyses` resuelve el folderPath. ES DE OTRA CUENTA:
      el permiso necesita las DOS puntas — la bucket policy allá y esta política acá.
      Con una sola, el listado falla y la respuesta trae el aviso en `warnings`.

Conditions:
  ConTabla: !Equals [!Ref CrearTablaIdempotencia, 'true']
  ConTablaCorridas: !Equals [!Ref CrearTablaCorridas, 'true']
  ConDisparoAsincrono: !Equals [!Ref DisparoAsincrono, 'true']

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]

Resources:
  LensApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # `lens-api` NO se puede usar: quedó reservado por un stack en
      # ROLLBACK_FAILED que nadie con `compliance-admin` puede borrar.
      FunctionName: lens-analisis
      CodeUri: src/
      Handler: app.lambda_handler
      # 300 s de techo con 260 s de presupuesto interno: el margen existe para
      # que el corte lo haga el servicio —devolviendo el resultado parcial con
      # estado INCOMPLETO— y no AWS con un 502 sin cuerpo.
      Timeout: 300
      # 3008 MB no es por memoria sino por CPU: Lambda asigna vCPU en
      # proporción, y la extracción de la capa de texto y el armado de las
      # páginas para Textract son trabajo de CPU.
      MemorySize: 3008
      Environment:
        Variables:
          # Vacío cuando no hay tabla: `almacen.py` cae a memoria y lo
          # reporta en /salud en vez de fingir que hay idempotencia.
          ALMACEN_TABLA: !If [ConTabla, !Ref TablaAnalisis, '']
          # Idem: vacío deja `corridas.py` en memoria, con la misma semántica
          # pero sin sobrevivir a la invocación. Lo reporta /salud.
          CORRIDAS_TABLA: !If [ConTablaCorridas, !Ref TablaCorridas, '']
          CORRIDAS_AMBIENTES: !Ref AmbientesCorridas
          DISPARO_ASINCRONO: !Ref DisparoAsincrono
          TIPOS_PRINCIPALES: !Ref TiposPrincipales
          MAX_DOCUMENTOS_LOTE: !Ref MaxDocumentosLote
          API_SECRET: !Ref ApiSecretValue
          GEMINI_API_KEY: !Ref GeminiApiKey
          MOTOR_OCR: !Ref MotorOcr
          MAX_PAGINAS_OCR: !Ref MaxPaginasOcr
          MAX_DOCUMENTOS: !Ref MaxDocumentos
          DOMINIOS_URL_PERMITIDOS: !Ref DominiosUrlPermitidos
          S3_BUCKET_DOCUMENTOS: !Ref BucketDocumentos
          PRESUPUESTO_S: 260
          # Reserva para la composición societaria, que es la SEGUNDA extracción
          # de la corrida: los 18 campos ya corrieron y el reloj sigue andando.
          # Cada sociedad entre los dueños cuesta una llamada más al modelo.
          MARGEN_SOCIOS_S: 35
          LOG_LEVEL: INFO
      # Endpoint HTTPS nativo de la Lambda. NO API Gateway: el rol
      # `compliance-admin` no tiene `apigateway:POST`. Auth NONE a nivel infra;
      # la protección real es el header x-api-secret que valida el handler,
      # mismo patrón que `casos-receptor`.
      Policies:
        # OCR de las páginas sin capa de texto.
        - Statement:
            - Effect: Allow
              Action: textract:DetectDocumentText
              Resource: '*'
        # Lectura del bucket de documentos, para `POST /v1/analyses`. Solo
        # lectura y solo ese bucket: el servicio nunca escribe en S3.
        #
        # Esto es la MITAD del permiso. El bucket es de otra cuenta, así que sin
        # la bucket policy del lado dueño esto no alcanza — y al revés tampoco.
        # Ver `bucket-policy-g66-company.json`.
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:ListBucket]
              Resource:
                - !Sub 'arn:aws:s3:::${BucketDocumentos}'
                - !Sub 'arn:aws:s3:::${BucketDocumentos}/*'
        # Idempotencia. Solo GetItem/PutItem, que es lo único que llama
        # `almacen.py`; sin tabla, la sentencia no existe.
        - !If
          - ConTabla
          - Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt TablaAnalisis.Arn
          - !Ref AWS::NoValue
        # Persistencia operacional por empresa. Lleva `Query` además de
        # Get/Put: el historial y la última corrida se leen por partición, que
        # es justamente lo que la tabla de idempotencia no puede hacer.
        - !If
          - ConTablaCorridas
          - Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt TablaCorridas.Arn
          - !Ref AWS::NoValue
        # Invocarse a sí misma para responder el 202 antes de procesar (Fase 2).
        # Sin esto el trabajo corre en línea: el contrato no cambia, la petición
        # tarda. No se declara cuando está apagado porque ES un cambio de
        # permisos, y es justo lo que deja el stack trabado.
        - !If
          - ConDisparoAsincrono
          - Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:lens-analisis'
          - !Ref AWS::NoValue
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: [POST, GET]
          AllowHeaders: [content-type, x-api-secret]

  # ── Almacén de idempotencia ───────────────────────────────────────────────
  # NO va en Redshift a propósito: el cluster se pausa de 18:30 a 04:00 y un
  # GET /v1/analyses a las once de la noche devolvería error sobre algo que sí
  # analizamos. La idempotencia es operacional, no analítica.
  #
  # PAY_PER_REQUEST porque el tráfico es a demanda y no vale la pena
  # aprovisionar capacidad para unas decenas de análisis por día.
  #
  # El TTL acota cuánto vive: son resultados de documentos societarios en una
  # base operacional, no un archivo histórico. Lo analítico va a `lens.*`.
  TablaAnalisis:
    Type: AWS::DynamoDB::Table
    Condition: ConTabla
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Persistencia operacional por empresa (Fase 1) ─────────────────────────
  # Es OTRA tabla, no la de arriba. `TablaAnalisis` indexa por `analysisId` y
  # sirve para no re-analizar; esta indexa por ambiente + `companyId` y sirve
  # para responder «¿cuál fue la última corrida de esta empresa?». Con una sola
  # clave no se pueden contestar las dos preguntas.
  #
  # El ambiente va DENTRO de la clave de partición (`ambiente#companyId`) y no
  # como atributo: LENS tiene un solo ambiente y recibe tráfico de desarrollo,
  # CI y producción. El mismo `companyId` es una empresa distinta en cada uno, y
  # sin el ambiente en la clave una prueba de desarrollo pisa la lectura de una
  # empresa real, en silencio.
  #
  # La clave de orden es `startedAt#analysisId` y no el id solo: el contrato dice
  # que el `analysisId` lo genera ms-company, así que no se puede dar por hecho
  # que sea ordenable en el tiempo.
  #
  # TTL más largo que el de idempotencia (90 días contra 30) porque lo que se
  # guarda acá es el historial por empresa, que es justamente lo que se consulta
  # tiempo después.
  TablaCorridas:
    Type: AWS::DynamoDB::Table
    Condition: ConTablaCorridas
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # NO se declara un AWS::Logs::LogGroup para fijar la retención.
  #
  # Se intentó y CloudFormation lo rechaza: el rol `compliance-admin` no tiene
  # `logs:CreateLogGroup`. Peor, el rollback tampoco puede borrarlo
  # (`logs:DeleteLogGroup`), así que el stack queda en ROLLBACK_FAILED y hay que
  # cambiarle el nombre. Las otras cuatro Lambdas del proyecto tampoco lo
  # declaran: Lambda crea el grupo sola en la primera invocación, con su propio
  # rol de ejecución.
  #
  # Consecuencia: los logs quedan con retención "nunca expira". Es aceptable
  # porque el servicio NO registra el contenido de los documentos —solo códigos
  # de respuesta, mensajes de error y trazas—, pero conviene fijar 30 días
  # cuando se habiliten los permisos:
  #
  #   aws logs put-retention-policy --log-group-name /aws/lambda/lens-api \
  #     --retention-in-days 30

Outputs:
  EndpointUrl:
    Description: URL base del servicio. El análisis es POST {url}v1/analisis
    Value: !GetAtt LensApiFunctionUrl.FunctionUrl
  FunctionName:
    Description: Nombre de la Lambda
    Value: !Ref LensApiFunction
