AWSTemplateFormatVersion: '2010-09-09'

Description: >
  lens-analisis-fnurl — VACÍO desde el 01-10-2026. La infraestructura de lens-api
  la maneja Terraform, en iac-ai-lens. Este stack solo tiene un recurso de relleno
  y no maneja nada.

# ── Por qué este stack existe todavía ─────────────────────────────────────────
#
# Hasta el 01-10-2026 este template declaraba la Lambda `lens-analisis`, su rol,
# la Function URL con sus dos permisos, las dos tablas DynamoDB y los tres
# secretos de Onboarding. Se importaron a Terraform —`iac-ai-lens`, PR #20, con un
# plan de 22 imports y 0 cambios— y después se sacaron de acá. Como todos tenían
# `DeletionPolicy: Retain`, CloudFormation los SOLTÓ sin borrarlos: siguen vivos,
# con la misma Function URL y los mismos datos, y ahora su único dueño es
# Terraform.
#
# El stack no se puede borrar desde esta cuenta: `compliance-admin` no tiene
# `cloudformation:DeleteStack`, y además tiene termination protection. Queda con
# este relleno —CloudFormation exige al menos un recurso— hasta que Arquitectura
# lo borre, junto con `lens-api` y `lens-api-fnurl`, muertos desde el 31-08.
#
# ── NO volver a declarar acá ningún recurso de lens-api ─────────────────────
# Lo tiene Terraform. Declararlo de nuevo crearía un SEGUNDO recurso con otro
# nombre —otra tabla vacía, otra Function URL—, o pelearía con Terraform por el
# mismo. La configuración se cambia con un PR en iac-ai-lens, y el código se
# despliega con `scripts/desplegar_codigo.sh`.

Resources:
  Relleno:
    Type: AWS::CloudFormation::WaitConditionHandle
