AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sincronización diaria Firestore → Redshift (schema colas_trabajo). Recupera lo
  que la app no pudo escribir mientras el cluster estaba pausado. Stack
  INDEPENDIENTE del receptor de casos y del logger.

Parameters:
  FirebaseSaB64:
    Type: String
    NoEcho: true
    Description: Service account de Firebase (JSON) en base64.
  FirestoreProject:
    Type: String
    Default: lens-ai-9da63
  FirestoreCollection:
    Type: String
    Default: casos_sf
  RedshiftCluster:
    Type: String
    Default: compliance-redshift-cluster
  RedshiftDatabase:
    Type: String
    Default: dev
  RedshiftDbUser:
    Type: String
    Default: awsuser
  RedshiftSchema:
    Type: String
    Default: colas_trabajo
  Horario:
    Type: String
    Default: 'cron(30 12 * * ? *)'
    Description: >
      UTC. Default 12:30 UTC = 08:30 hora Chile: después de que el cluster se
      reanuda (08:00 UTC) y antes de que se pause (22:30 UTC).
  EmailAlerta:
    Type: String
    Default: ''
    Description: >
      Correo que recibe la alarma cuando el respaldo falla. Se pasa en el deploy
      (no se guarda en el repo). AWS manda un correo de confirmación: hasta que
      se confirme, la alarma suena pero no llega a nadie.

Conditions:
  ConCorreo: !Not [!Equals [!Ref EmailAlerta, '']]

Globals:
  Function:
    Runtime: python3.12
    # 15-10-2026: 600 s / 512 MB no alcanzaban para leer todo de una vez y el job
    # murió el 06-09 sin que nadie se enterara. El código ahora es incremental y
    # escribe por tandas; esto es margen, no la solución.
    Timeout: 900
    MemorySize: 1024
    Architectures: [arm64]

Resources:
  ColasSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: colas-trabajo-sync-diario
      Handler: app.lambda_handler
      CodeUri: src/
      Description: Lee los casos y su auditoría de Firestore y los escribe en Redshift.
      Environment:
        Variables:
          FIREBASE_SA_JSON: !Ref FirebaseSaB64
          FIRESTORE_PROJECT: !Ref FirestoreProject
          FIRESTORE_COLLECTION: !Ref FirestoreCollection
          REDSHIFT_CLUSTER: !Ref RedshiftCluster
          REDSHIFT_DATABASE: !Ref RedshiftDatabase
          REDSHIFT_DB_USER: !Ref RedshiftDbUser
          REDSHIFT_SCHEMA: !Ref RedshiftSchema
      Policies:
        - Statement:
            - Effect: Allow
              Action: redshift-data:ExecuteStatement
              Resource: !Sub 'arn:aws:redshift:${AWS::Region}:${AWS::AccountId}:cluster:${RedshiftCluster}'
            # DescribeStatement identifica por Id de statement, no por recurso:
            # AWS no admite scope por ARN acá, tiene que ir con '*'.
            - Effect: Allow
              Action: redshift-data:DescribeStatement
              Resource: '*'
            - Effect: Allow
              Action: redshift:GetClusterCredentials
              Resource:
                - !Sub 'arn:aws:redshift:${AWS::Region}:${AWS::AccountId}:dbuser:${RedshiftCluster}/${RedshiftDbUser}'
                - !Sub 'arn:aws:redshift:${AWS::Region}:${AWS::AccountId}:dbname:${RedshiftCluster}/${RedshiftDatabase}'
      Events:
        Diario:
          Type: Schedule
          Properties:
            Schedule: !Ref Horario
            Name: colas-sync-diario
            Description: Sincroniza la Bandeja de Casos con Redshift todas las mañanas.

  # ── Alarma ─────────────────────────────────────────────────────────────────
  # El job murió 39 días sin que nadie se enterara. Dos señales:
  #   · Errors ≥ 1: cualquier corrida que termina en excepción. El código NO lanza
  #     por una pausa normal del cluster (noche o fin de semana), sí cuando la
  #     pausa pasa de 4 días o la corrida no alcanza a recuperar el atraso.
  #   · Invocations < 1 en un día: el horario dejó de dispararlo (regla
  #     deshabilitada, stack roto). Sin esto, "no corre" no da errores.
  AlertaTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: colas-sync-diario-alerta
      DisplayName: Lens - respaldo Redshift

  AlertaCorreo:
    Type: AWS::SNS::Subscription
    Condition: ConCorreo
    Properties:
      TopicArn: !Ref AlertaTopic
      Protocol: email
      Endpoint: !Ref EmailAlerta

  AlarmaFalla:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: colas-sync-diario-falla
      AlarmDescription: >
        El respaldo diario Firestore → Redshift (colas_trabajo) terminó en error.
        Ver el log /aws/lambda/colas-trabajo-sync-diario y el documento
        config/colasSyncDiario de Firestore.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ColasSyncFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertaTopic]
      OKActions: [!Ref AlertaTopic]

  AlarmaSinCorrer:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: colas-sync-diario-sin-correr
      AlarmDescription: >
        El respaldo diario Firestore → Redshift no se ejecutó en las últimas 24 h.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ColasSyncFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertaTopic]

Outputs:
  FunctionName:
    Value: !Ref ColasSyncFunction
  LogGroup:
    Value: !Sub '/aws/lambda/${ColasSyncFunction}'
  Horario:
    Value: !Ref Horario
